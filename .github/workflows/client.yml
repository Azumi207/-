name: Windows client and repository
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/check-repository.py
      - run: ./scripts/install-ffmpeg.ps1 -Destination ./tools/ffmpeg
      - run: dotnet build windows-client/Frameflow.csproj -c Release
      - run: dotnet windows-client/bin/Release/net9.0-windows/Frameflow.dll --self-test "$env:RUNNER_TEMP/frameflow-core"
      - name: Publish self-contained x64 (no bundled FFmpeg)
        run: ./scripts/build-client.ps1 -WithoutMedia -Output "$env:RUNNER_TEMP/frameflow-portable"
      - run: python scripts/package-client.py --publish "$env:RUNNER_TEMP/frameflow-portable"
      - name: Extract release and prepare separate media engine
        run: |
          Expand-Archive release-assets/Frameflow-Client-Windows-0.2.0-Portable-win-x64.zip "$env:RUNNER_TEMP/portable-extracted"
          Copy-Item tools/ffmpeg "$env:RUNNER_TEMP/portable-extracted/Frameflow/Engine" -Recurse
      - name: Run released apphost with empty .NET root
        run: python scripts/test-portable.py --app "$env:RUNNER_TEMP/portable-extracted/Frameflow" --output "$env:RUNNER_TEMP/portable-test"
      - run: python scripts/package-source.py
